<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChaoxingSignFaker</title>
    <style>
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f5f5f5;
        }
        #button {
            width: 100px;
            height: 40px;
            line-height: 40px;
            text-align: center;
            background-color: #007bff;
            color: #fff;
            cursor: pointer;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div id="info"></div>
    <div onclick="download()" id="button">下载</div>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const url = new URL(window.location.href);
            if (url.searchParams.has('phone')) {
                document.getElementById('info').innerText = '请使用 随地大小签APP（ChaoxingSignFaker） 扫码。';
                window.location.href = 'cxsignfaker://import' + url.search;
                return;
            }
            setTimeout(download, 1000);
        });

        function download() {
            window.location.href = 'https://github.com/aquamarine5/ChaoxingSignFaker/releases/latest';
        }
    </script>
</body>
</html>
